# ==== TimeGAN LOB Simulation Config ===

# Data
tickers = ["AMZN", "AAPL", "GOOG", "INTC", "MSFT"]  # LOBSTER tickers to train on; each gets its own scaler and label
resample_freq = "1s"      # pandas frequency the book is resampled to
trim_regimes = "15m"      # pandas duration cut from both the open and the close of each day
window_length = 64        # steps per training window (seconds, at 1 s resampling)
train_frac = 0.7          # chronological share of each ticker's day used for training
val_frac = 0.15           # following share used for validation (early stopping, model choice)
test_frac = 0.15          # final share held out for the reported results; the three must sum to 1

# Model
hidden_dim = 64           # width of the latent space and of the generator, supervisor and discriminator GRUs
noise_dim = 32            # size of the generator's per-step noise vector
num_layers = 3            # stacked GRU layers per network

# Training
batch_size = 128          # windows per batch (each batch holds a single ticker)
learning_rate = 1e-3      # Adam learning rate for all three phases
embedding_epochs = 50     # phase 1: embedder + recovery (autoencoder)
supervised_epochs = 15    # phase 2: supervisor on real latents
joint_epochs = 100        # phase 3: adversarial training of all networks
d_threshold = 0.5         # discriminator only updates while its loss is above this, so it can't dominate the generator
train_seed = 0            # seed for torch and batch shuffling during training

# Evaluation
sample_length = 128       # steps per generated window in predict.py (may exceed window_length)
num_samples = 200         # real and synthetic windows compared per ticker
num_draws = 5             # numbers of trials to run per metric for uncertainty
burn_in = 10              # generated steps discarded at the start while the GRUs warm up
eval_seed = 48            # seed for sampling windows and generating in predict.py
