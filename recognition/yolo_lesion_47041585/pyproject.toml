[project]
name = "yolo_lesion_47041585"
version = "0.1.0"
description = "YOLO11 lesion detection and triage on the ISIC2018 challenge dataset (COMP3710 Task 3)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Alex Janevik", email = "ajanevik@gmail.com" }]
dependencies = [
  "matplotlib>=3.11.2",
  "numpy>=2.5.4",
  "opencv-python>=5.0.0.93",
  "pillow>=13.0.0",
  "pyyaml>=6.0.3",
  "rich>=15.0.0",
  "torch>=2.14.1",
  "ultralytics>=8.4.182",
]

[project.scripts]
predict = "yolo_lesion_47041585.predict:main"
train = "yolo_lesion_47041585.train:main"

[dependency-groups]
dev = [
  "pyright>=1.1.414",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "scripts"]
venvPath = "."
venv = ".venv"

[tool.uv]
exclude-newer = "2026-10-20T10:08:17+10:00"
